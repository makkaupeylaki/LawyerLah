name = "lawyerlah"
main = "index.js"
compatibility_date = "2026-10-01"

# The static site in ../web is served by this same Worker (Workers static assets),
# so the pages and /api/* share one origin.
# The Worker runs first for the API and the HTML pages (to make canonical/OG URLs absolute);
# other files (CSS, JS, images) are served straight from assets.
[assets]
directory = "../web"
binding = "ASSETS"
run_worker_first = ["/api/*", "/", "/index.html", "/about", "/about.html"]

# Workers AI (used while PROVIDER = "cloudflare" in index.js)
[ai]
binding = "AI"

# Vector index of the Acts (768 dims, cosine, metadata index on "code"). Already loaded; the Worker only reads it.
[[vectorize]]
binding = "VECTORIZE"
index_name = "lawyerlah-laws"

# Full section text: law:{code}:{section}, act:{code}, acts:index. Already loaded; the Worker only reads it.
[[kv_namespaces]]
binding = "LAWS"
id = "00000000000000000000000000000000"

# Per-visitor daily counters (keyed on a hash of the IP, never the IP itself)
# and the global daily AI cap counter.
# Create with:  npx wrangler kv namespace create LIMITS   then paste the id below.
[[kv_namespaces]]
binding = "LIMITS"
id = "00000000000000000000000000000000"

# Helpful / Wrong votes.
# Create with:  npx wrangler kv namespace create FEEDBACK   then paste the id below.
[[kv_namespaces]]
binding = "FEEDBACK"
id = "00000000000000000000000000000000"

[vars]
# Max model calls per day across all visitors (on top of 10 per visitor).
GLOBAL_DAILY_CAP = "300"
# Optional: absolute site URL for canonical/OG tags, e.g. "https://example.com".
# Leave empty to use the origin the page was requested on.
SITE_URL = ""
